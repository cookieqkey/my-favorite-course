
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netology-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: netology-web
  template:
    metadata:
      labels:
        app: netology-web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
              name: web-port

        - name: multitool
          image: wbitt/network-multitool:latest
          env:
            - name: HTTP_PORT
              value: "8888"
            - name: HTTPS_PORT
              value: "8443"
---
apiVersion: v1
kind: Service
metadata:
  name: netology-web-service
spec:
  selector:
    app: netology-web
  ports:
  - name: netology-web-port
    port: 80
    targetPort: web-port
