
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-exchange
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-exchange
  template:
    metadata:
      labels:
        app: data-exchange
    spec:
      containers:
        - name: busybox
          image: busybox:latest
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                date >> /data/shared.txt
                sleep 5
              done
          volumeMounts:
            - name: shared-volume
              mountPath: /data

        - name: multitool
          image: wbitt/network-multitool
          command: ['sleep', 'infinity']
          volumeMounts:
            - name: shared-volume
              mountPath: /data

      volumes:
        - name: shared-volume
          emptyDir: {}
