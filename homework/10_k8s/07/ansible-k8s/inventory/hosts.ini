[kube_control_plane]
k8s-master ansible_host=10.0.1.11

[kube_node]
k8s-worker-1 ansible_host=10.0.1.12
k8s-worker-2 ansible_host=10.0.1.13
k8s-worker-3 ansible_host=10.0.1.14
k8s-worker-4 ansible_host=10.0.1.15

[k8s_cluster:children]
kube_control_plane
kube_node

[all:vars]
ansible_user=ubuntu
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_private_key_file=~/.ssh/id_ed25519
# для ProxyJump используем актуального пользователя и адрес bastion-хоста
ansible_ssh_common_args='-o ProxyJump=ubuntu@84.252.130.197 -o StrictHostKeyChecking=no'