apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-web-content
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>{{ .Values.appName }}</title>
    </head>
    <body>
      <h1>{{ .Values.welcomeMessage }}</h1>
      <p>Release: {{ .Release.Name }}</p>
      <p>Namespace: {{ .Release.Namespace }}</p>
      <p>NGINX image: {{ .Values.nginx.image.repository }}:{{ .Values.nginx.image.tag }}</p>
    </body>
    </html>
