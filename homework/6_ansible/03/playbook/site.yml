- name: Install Lighthouse
  tags:
    - lighthouse
  hosts: lighthouse
  become: true
  handlers:
    - name: Restart nginx
      ansible.builtin.service:
        name: nginx
        state: restarted
  tasks:
    - name: Install nginx and git
      ansible.builtin.apt:
        name:
          - nginx
          - git
        state: present
        update_cache: true
    - name: Remove default nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify:
        - Restart nginx
    - name: Create lighthouse directory
      ansible.builtin.file:
        path: "{{ lighthouse_path }}"
        state: directory
        owner: www-data
        group: www-data
        mode: "0755"
    - name: Configure git safe directory
      ansible.builtin.command:
        cmd: git config --global --add safe.directory "{{ lighthouse_path }}"
      changed_when: false
    - name: Download Lighthouse static files
      ansible.builtin.git:
        repo: "{{ lighthouse_repo }}"
        dest: "{{ lighthouse_path }}"
        version: master
        force: true
    - name: Set lighthouse directory permissions
      ansible.builtin.file:
        path: "{{ lighthouse_path }}"
        owner: www-data
        group: www-data
        mode: "0755"
        recurse: true
    - name: Configure nginx for Lighthouse
      ansible.builtin.template:
        src: lighthouse.conf.j2
        dest: /etc/nginx/conf.d/lighthouse.conf
        owner: root
        group: root
        mode: "0644"
      notify:
        - Restart nginx
    - name: Ensure nginx is running
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
